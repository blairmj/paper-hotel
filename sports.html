<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f7">
  <title>체육 준비실 | 학교 탈출</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="music.css?v=hints17">
</head>
<body data-room="sports">
  <main id="musicGame" aria-label="학교 탈출 208호 체육 준비실">
    <canvas id="roomView" tabindex="0" aria-label="체육 준비실 내부. 바닥을 눌러 이동하고 화면을 끌어 둘러보세요."></canvas>
    <header class="room-head">
      <strong class="school"><span>208</span>체육 준비실</strong>
      <nav aria-label="메뉴"><button id="bag" hidden>찾은 단서</button><button id="map">안내도</button></nav>
    </header>
    <div id="spots" aria-label="조사할 물건"></div>
    <footer class="room-foot">
      <div class="movement" aria-label="이동">
        <button id="left" aria-label="왼쪽 보기">‹</button>
        <button id="walk" aria-label="한 걸음 앞으로">↑</button>
        <button id="stepBack" aria-label="한 걸음 뒤로">↓</button>
        <button id="right" aria-label="오른쪽 보기">›</button>
      </div>
    </footer>
    <section id="escape" hidden aria-label="체육 준비실 탈출 완료">
      <span class="sr-only" role="status">체육 준비실 문이 열렸어요.</span>
      <div><a class="main-button" id="nextRoom" href="music.html">다음 교실로</a><button id="replay">다시 풀기</button></div>
    </section>
    <dialog id="inspect" aria-labelledby="panelTitle">
      <div class="panel-top"><h1 id="panelTitle"></h1><button id="dismiss" aria-label="닫기">×</button></div>
      <div id="panelBody"></div>
    </dialog>
    <noscript>게임을 플레이하려면 자바스크립트를 켜 주세요.</noscript>
  </main>
  <script src="three.min.js"></script>
  <script src="rooms.js?v=controls12"></script>
  <script src="review-rooms.js?v=hints17"></script>
  <script src="music-ensemble.js?v=room10"></script>
  <script src="music-art.js?v=interiors15"></script>
  <script src="school-room-art.js?v=interiors15"></script>
  <script src="music-world.js?v=interiors15"></script>
  <script src="school-interiors.js?v=interiors15"></script>
  <script src="school-room.js?v=hints17"></script>
</body>
</html>
