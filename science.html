<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f7">
  <title>과학실 | 학교 탈출</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="music.css?v=layout51">
  <link rel="stylesheet" href="route-ui.css?v=layout51">
  <link rel="stylesheet" href="science-balance.css?v=bench57">
</head>
<body data-room="science">
  <main id="musicGame" aria-label="학교 탈출 204호 과학실">
    <canvas id="roomView" tabindex="0" aria-label="과학실 내부. 바닥을 눌러 이동하고 화면을 끌어 둘러보세요."></canvas>
    <header class="room-head">
      <strong class="school"><span>204</span>과학실</strong>
      <nav aria-label="메뉴"><button id="bag" type="button" hidden>찾은 단서</button><button id="map" type="button">안내도</button></nav>
    </header>
    <div id="spots" aria-label="조사할 물건"></div>
    <section id="balanceWorkbench" hidden aria-label="실험대의 양팔저울" aria-describedby="balanceHelp">
      <div id="balanceTargets" role="group" aria-label="저울 접시와 구슬"></div>
      <div class="bench-tools">
        <div id="balanceScales" role="group" aria-label="살펴볼 저울" hidden>
          <button type="button" aria-pressed="true">첫째 저울</button>
          <button type="button" aria-pressed="false">둘째 저울</button>
        </div>
        <p id="balanceHelp">구슬을 끌거나, 구슬과 놓을 곳을 차례로 누르세요.</p>
        <div class="bench-actions">
          <button id="balanceReset" type="button">처음 배치로</button>
          <button id="leaveBench" type="button">실험대에서 물러나기</button>
        </div>
      </div>
      <output id="balanceStatus" class="sr-only" aria-live="polite"></output>
    </section>
    <footer class="room-foot">
      <div class="movement" aria-label="이동">
        <button id="left" type="button" aria-label="왼쪽 보기">‹</button>
        <button id="walk" type="button" aria-label="한 걸음 앞으로">↑</button>
        <button id="stepBack" type="button" aria-label="한 걸음 뒤로">↓</button>
        <button id="right" type="button" aria-label="오른쪽 보기">›</button>
      </div>
    </footer>
    <section id="escape" hidden aria-label="과학실 복구 완료">
      <span class="sr-only" role="status">과학실 문이 열렸어요.</span>
      <div><a class="main-button" id="nextRoom" href="broadcast.html">다음 교실로</a><button id="replay" type="button">다시 풀기</button></div>
    </section>
    <dialog id="inspect" aria-labelledby="panelTitle">
      <div class="panel-top"><h1 id="panelTitle"></h1><button id="dismiss" type="button" aria-label="닫기">×</button></div>
      <div id="panelBody"></div>
    </dialog>
    <noscript>게임을 플레이하려면 자바스크립트를 켜 주세요.</noscript>
  </main>
  <script src="vendor/gl-matrix.min.js"></script>
  <script src="vendor/earcut.min.js"></script>
  <script src="webgl/model.js?v=webgl50"></script>
  <script src="webgl/geometry.js?v=webgl50"></script>
  <script src="webgl/picking.js?v=webgl50"></script>
  <script src="webgl/shaders.js?v=webgl50"></script>
  <script src="webgl/renderer.js?v=webgl50"></script>
  <script src="review-rooms.js?v=classroom43"></script>
  <script src="school-routes.js?v=room-route41"></script>
  <script src="school-map.js?v=layout51"></script>
  <script src="school-puzzles.js?v=library52"></script>
  <script src="music-art.js?v=webgl50"></script>
  <script src="music-world.js?v=bench57"></script>
  <script src="interior-artwork.js?v=webgl50"></script>
  <script src="school-corridor.js?v=webgl50"></script>
  <script src="school-interiors.js?v=webgl50"></script>
  <script src="science-balance.js?v=bench57"></script>
  <script src="specialty-interiors.js?v=bench57"></script>
  <script src="school-room-art.js?v=library52"></script>
  <script src="school-room.js?v=bench57"></script>
</body>
</html>
