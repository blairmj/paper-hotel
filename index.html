'use strict';
const $=id=>document.getElementById(id), canvas=$('world'),dlg=$('sheet'),body=$('modalBody');
let renderer,scene,camera,root,room,markers=[];
let yaw=0,pitch=0,facingTarget=null,moving=null,clockLast=0,tipTimer,dirty=true;
const keys=new Set(),angles=['정면','오른쪽','뒤쪽','왼쪽'];
const STORE='paperhotel.explore.v1';
let book={room:203,visits:{}};
try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.visits&&typeof s.visits==='object'&&HOTEL.some(r=>r.n===s.room))book=s}catch{}
function progress(n=room.n){const v=book.visits[n];if(v&&Array.isArray(v.found)&&Array.isArray(v.tests))return v;return book.visits[n]={found:[],tests:[],solved:false}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(book))}catch{}}
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),limit=(v,a,b)=>Math.max(a,Math.min(b,v));
function tip(t){$('tip').textContent=t;$('tip').classList.add('on');clearTimeout(tipTimer);tipTimer=setTimeout(()=>$('tip').classList.remove('on'),3300)}
function focusGame(){canvas.focus({preventScroll:true})}
function closeSheet(){if(dlg.open)dlg.close()}
dlg.addEventListener('close',()=>{keys.clear();focusGame();dirty=true});
$('close').onclick=closeSheet;dlg.addEventListener('click',e=>{if(e.target===dlg){const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSheet()}});
function modal(kicker,title,html,wide=false){facingTarget=null;keys.clear();moving=null;dlg.classList.toggle('wide',wide);$('modalKicker').textContent=kicker;$('modalTitle').textContent=title;body.innerHTML=html;if(!dlg.open)dlg.showModal();dlg.scrollTop=0}
const tag=()=> 'PAPER HOTEL  /  ROOM '+room.n;
function btn(text,fn,host=body,primary=false){const el=document.createElement('button');el.type='button';el.className='action'+(primary?' primary':'');el.textContent=text;el.onclick=fn;host.append(el);return el}
function row(){const el=document.createElement('div');el.className='row';body.append(el);return el}
function cells(s,cols=3,lit=false){return '<span class="cells '+(cols===2?'two':'')+'">'+[...s].map(n=>'<span class="'+(lit&&Number(n)%2?'lit':'')+'">'+n+'</span>').join('')+'</span>'}
function dial(a,b){
 let marks='',hands='';for(let h=1;h<=12;h++){let t=h*Math.PI/6;marks+='<text x="'+(45+34*Math.sin(t))+'" y="'+(47-34*Math.cos(t))+'" text-anchor="middle" fill="#443034" font-size="9">'+h+'</text>'}
 for(const [v,len] of [[a,21],[b,27]])hands+='<path d="M45 45 l'+len*Math.sin(v*Math.PI/6)+' '+(-len*Math.cos(v*Math.PI/6))+'" stroke="#682f32" stroke-width="3" stroke-linecap="round"/>';
 return '<svg class="mini-clock" viewBox="0 0 90 90" role="img" aria-label="바늘 '+a+'와 '+b+'"><circle cx="45" cy="45" r="42" stroke="#906d45" fill="#f9e8bc"/>'+marks+hands+'<circle cx="45" cy="45" r="3" fill="#654138"/></svg>';
}
function clueExtra(id){
 if(id==='record')return '<div class="diagram">'+dial(3,6)+'18 '+dial(3,12)+'36</div>';
 if(id==='type')return '<div class="slip sample">ㅅ ㅏ ㅁ　/　ㅍ ㅏ ㄹ　/　ㅇ ㅣ</div>';
 if(id==='shelf')return '<div class="diagram">'+cells(archiveCard(0),2)+' → '+cells(archiveCard(1),2)+'</div>';
 if(id==='sort')return '<div class="diagram">'+cells(archiveCard(2),2)+'</div>';
 if(id==='photo')return '<div class="slip" style="font-size:29px;line-height:1.5;max-width:260px" aria-label="농구공 다섯, 테니스공 둘, 배구공 셋, 미식축구공 넷">'+sportsBalls.join(' ')+'</div>';
 if(id==='flag')return '<div class="slip sample">🏐　🏈　🎾　🏀</div>';
 if(id==='bag'||id==='apron'){const s=id==='bag'?'111010010':'131232030';return '<div class="diagram">'+cells(s)+' → '+cells([...s].map(v=>Number(v)%2).join(''),3,true)+'</div><small>오른쪽 점검 기록은 1이 켜짐, 0이 꺼짐입니다.</small>'}
 if(id==='stencil')return '<div class="skystars">'+['★★★','★★★★','★★','★★★★★'].map(v=>'<span>'+v+'</span>').join('')+'</div>';
 return '';
}
function sync(){const st=progress();$('clueCount').textContent=st.found.length+'/'+room.clues.length;for(const m of markers){const checked=st.found.includes(m.id);m.el.firstChild.textContent=checked?'✓':m.id==='door'?(st.solved?'↗':'◇'):m.id==='station'?'◎':'＋'}dirty=true}
function findClue(id){
 const clue=room.clues.find(c=>c[0]===id);if(!clue)return;
 const st=progress();if(!st.found.includes(id)){st.found.push(id);save();sync()}
 modal(tag()+'  /  단서 수첩에 기록',clue[1],'<p>'+clue[2]+'</p>'+clueExtra(id));if(id==='test')testBench();else btn('방으로 돌아가기',closeSheet,row(),true);
}
function testBench(){
 const log=document.createElement('div');body.append(log);const refresh=()=>{log.innerHTML=progress().tests.map(t=>'<div class="slip"><b>시험 기록 · '+t.pair+'</b><p>두 규칙의 예상값 '+t.a+' / '+t.b+'　·　실제 출력 <strong>'+t.result+'</strong></p></div>').join('')};refresh();
 const r=row();for(const [pair,big,product] of [['3와 9',27,27],['6과 9',27,54]])btn(pair+' 시험판',()=>{modal(tag(),'시험할 바늘 선택', '<p><strong>'+pair+'</strong>에서 두 규칙이 예측하는 값을 먼저 적어 보세요.</p><form id="testForm"><p><label>㉠ 큰 수의 세 배 <input required type="number" min="0" max="200" name="a" style="width:78px"></label></p><p><label>㉡ 두 바늘 수의 곱 <input required type="number" min="0" max="200" name="b" style="width:78px"></label></p><button class="action primary">손잡이 당기기</button><p role="status" class="feedback"></p></form>');$('testForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(+f.get('a')!==big||+f.get('b')!==product){e.target.querySelector('.feedback').textContent='두 규칙대로 계산한 예상값을 확인해 보세요.';return}const st=progress();if(!st.tests.some(t=>t.pair===pair))st.tests.push({pair,a:big,b:product,result:product});save();modal(tag(),'종이띠에 찍힌 결과','<div class="slip sample">'+pair+' → '+product+'</div><p>'+(product===big?'두 예상값이 같아요. 다른 시험판으로 두 가설을 구별해 보세요.':'두 예상값 중 두 바늘의 수를 곱한 결과와 일치해요.')+'</p>');btn('시험대로 돌아가기',()=>findClue('test'),row());btn('방으로 돌아가기',closeSheet,row(),true)}},r);
}
function mazeSvg(){
 const xy=n=>[23+n%5*51,23+Math.floor(n/5)*51];let paths='';
 for(const [a,b] of mazeRoads){let [x,y]=xy(a),[u,v]=xy(b);paths+='<path d="M'+x+' '+y+' L'+u+' '+v+'" fill="none" stroke="#faf0ce" stroke-width="21" stroke-linecap="square"/>'}
 const labels=[[0,'▲'],[6,'중'],[12,'간'],[19,'칸'],[24,'●'],[2,'위'],[8,'칸'],[10,'앞'],[15,'뒤'],[22,'아'],[20,'래']];
 return '<svg class="map" viewBox="0 0 250 250" role="img" aria-label="종이 미로. 삼각형에서 동그라미로 이어진 길을 따라 글자를 읽으세요."><rect width="250" height="250" fill="#647368"/>'+paths+labels.map(([n,t])=>{let [x,y]=xy(n);return '<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15" fill="#48342c">'+t+'</text>'}).join('')+'</svg>';
}
function solvedView(){const st=progress();st.solved=true;save();sync();modal(tag()+'  /  잠금 해제',room.n===205?'서랍 속 객실 열쇠':'잠금쇠가 풀렸다','<p>'+({203:'멈췄던 추가 움직이기 시작한다. 문 쪽에서 작은 딸깍 소리가 난다.',205:'길이 가리킨 서랍에서 황동 열쇠가 나왔다. 이제 객실 문을 열 수 있다.',208:'장비함 안의 황동 열쇠를 챙겼다.',206:'보관함 안에서 문에 맞는 열쇠를 찾았다.'}[room.n]||'종이 장치가 움직이고 객실 문의 잠금이 풀렸다.')+'</p>');btn('문으로 향하기',()=>{closeSheet();const door=markers.find(m=>m.id==='door');const p=door.anchor.getWorldPosition(new THREE.Vector3()).sub(camera.position);targetLook(Math.atan2(p.x,-p.z),Math.atan2(p.y,Math.hypot(p.x,p.z)))},row(),true)}
function puzzle(){
 const st=progress();if(st.solved){solvedView();return}
