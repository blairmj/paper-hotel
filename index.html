<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#261b25"><title>학교 탈출</title><link rel="icon" href="data:,"><link rel="stylesheet" href="school.css"></head>
<body><main id="stage"><canvas id="world" tabindex="0" aria-label="교실 내부. 드래그나 방향키로 시선을 돌리고 W A S D로 이동하세요. 탭으로 보이는 물건을 선택합니다."></canvas><div id="vignette"></div><div id="marks"></div></main>
<header><div class="brand"><i class="emblem" aria-hidden="true">♢</i><div><small>SCHOOL ESCAPE</small><strong>학교 탈출</strong></div></div><nav><button id="journal">단서 수첩 <b id="clueCount">0</b></button><button id="directory">학교 안내도</button><button id="help" aria-label="조작 도움말">?</button></nav></header>
<footer><div class="room-label"><small id="roomNo"></small><h1 id="roomTitle"></h1></div><div class="look"><button id="turnL" aria-label="왼쪽 벽 보기">‹</button><span id="bearing">정면</span><button id="turnR" aria-label="오른쪽 벽 보기">›</button></div><div class="foot-end"><button id="step" title="바라보는 쪽으로 한 걸음">한 걸음 ↑</button></div></footer>
<section id="exitNotice" aria-label="탈출 결과" hidden>
  <span id="exitText" role="status"></span><button type="button" id="continueRoom"></button>
</section>
<div id="tip" role="status"></div><div id="fatal" hidden></div>
<dialog id="sheet" aria-labelledby="modalTitle"><div class="modal-head"><small id="modalKicker"></small><button id="close" aria-label="닫기">×</button></div><h2 id="modalTitle"></h2><div id="modalBody"></div></dialog>
<script src="three.min.js"></script><script src="rooms.js"></script><script src="scenery.js"></script><script src="game.js"></script></body></html>
